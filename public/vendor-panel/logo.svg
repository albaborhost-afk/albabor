  <text x="48" y="41" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#F39C12">PRO &middot; ESPACE VENDEUR</text>
